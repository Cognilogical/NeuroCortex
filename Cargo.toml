[package]
name = "neurocortex"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# We'll need these for executing bash/podman
tokio-process = "0.2"

# For LLM inference / local LLM calling
reqwest = { version = "0.11", features = ["json"] }

# LanceDB for storing rules
lancedb = "0.27"
arrow = "57.3.0"
log = "0.4.29"
env_logger = "0.11.10"
fastembed = "4"
futures = "0.3"
uuid = { version = "1.23.1", features = ["v4"] }
